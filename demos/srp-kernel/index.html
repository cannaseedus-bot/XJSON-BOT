<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SRP Kernel Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --state-color: #666;
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #e8e8e8;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      border: 2px solid var(--state-color);
      transition: border-color 0.3s, box-shadow 0.3s;
      min-width: 280px;
    }
    .card.active {
      border-color: #2ef;
      box-shadow: 0 0 20px rgba(34, 238, 255, 0.3);
    }
    h2 { margin: 0 0 16px; font-size: 18px; }
    .status {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 16px;
      text-transform: uppercase;
      color: var(--state-color);
      transition: color 0.3s;
    }
    .card.active .status { color: #2ef; }
    .counter {
      font-size: 14px;
      color: #888;
      margin-bottom: 16px;
    }
    button {
      background: #0f3460;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background: #1a5f7a; }
    .meta {
      margin-top: 16px;
      font-size: 11px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h2>SRP Kernel Demo</h2>
    <div class="status" id="status">inactive</div>
    <div class="counter">Ticks: <span id="tick-count">0</span></div>
    <button id="btn">Submit Event</button>
    <div class="meta">
      submit → event → tick → collapse → project
    </div>
  </div>

  <script>
    // ================================================
    // SRP Kernel Demo - Three-File Rule
    // UI emits events; SW owns tick/collapse/project
    // ================================================

    // Register service worker
    (async () => {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js');
          console.log('[SRP] Service worker registered');
        } catch (err) {
          console.error('[SRP] SW registration failed:', err);
        }
      }
    })();

    // submit → event
    document.getElementById('btn').addEventListener('click', async () => {
      const reg = await navigator.serviceWorker.ready;

      // Emit a structured SRP event
      reg.active?.postMessage({
        '@type': 'srp.event',
        '@id': 'asx://srp/event/ui.submit.' + Date.now(),
        '@ts': Date.now(),
        'event': 'ui.submit',
        'payload': { 'toggle': true },
        'source': { 'kind': 'ui', 'origin': 'index.html' }
      });

      console.log('[SRP] Event submitted');
    });

    // Listen for projections from SW
    navigator.serviceWorker.addEventListener('message', (e) => {
      const msg = e.data;
      if (!msg || msg['@type'] !== 'srp.projection.apply') return;

      console.log('[SRP] Projection received:', msg);

      // Apply projection to DOM
      const { statusText, active, tickCount } = msg.view || {};

      // Update status text
      if (typeof statusText === 'string') {
        document.getElementById('status').textContent = statusText;
      }

      // Update tick count
      if (typeof tickCount === 'number') {
        document.getElementById('tick-count').textContent = tickCount;
      }

      // Update card class
      const card = document.getElementById('card');
      if (active) {
        card.classList.add('active');
      } else {
        card.classList.remove('active');
      }
    });
  </script>
</body>
</html>
